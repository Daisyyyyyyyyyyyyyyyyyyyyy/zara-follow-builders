name: Daily Email Watchdog

on:
  schedule:
    # Run after the main digest cron should have completed.
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ensure-digest-ran:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest Daily Email Digest run
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const workflowFile = 'daily-email-digest.yml';
            const { owner, repo } = context.repo;

            const workflow = await github.rest.actions.getWorkflow({
              owner,
              repo,
              workflow_id: workflowFile
            });

            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowFile,
              per_page: 10
            });

            const now = Date.now();
            const lookbackMs = 36 * 60 * 60 * 1000;
            const recentScheduledOrManualRuns = runs.data.workflow_runs.filter((run) => {
              const createdAt = Date.parse(run.created_at);
              return Number.isFinite(createdAt)
                && now - createdAt <= lookbackMs
                && ['schedule', 'workflow_dispatch', 'repository_dispatch'].includes(run.event);
            });

            const latestSuccessfulRun = recentScheduledOrManualRuns.find((run) => run.conclusion === 'success');
            const shouldTrigger = !latestSuccessfulRun;

            core.info(`Workflow state: ${workflow.data.state}`);
            core.info(`Recent candidate runs in last 36h: ${recentScheduledOrManualRuns.length}`);
            if (latestSuccessfulRun) {
              core.info(`Latest successful run: #${latestSuccessfulRun.run_number} at ${latestSuccessfulRun.created_at}`);
            } else {
              core.warning('No successful Daily Email Digest run found in the last 36 hours.');
            }

            core.setOutput('should_trigger', shouldTrigger ? 'true' : 'false');

      - name: Trigger Daily Email Digest fallback run
        if: steps.check.outputs.should_trigger == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'daily-email-digest.yml',
              ref: context.payload.repository.default_branch
            });
            core.notice('Triggered Daily Email Digest via workflow_dispatch fallback.');